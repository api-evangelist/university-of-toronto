        note: '"Toward an AI-ready university" — U of T AI Task Force, guidelines, tools and training.'
      - url: https://its.utoronto.ca/ai/
        status: 200
        note: Information Technology Services AI tooling for staff and students.
      - url: https://www.linkedin.com/school/university-of-toronto/
        status: 999
