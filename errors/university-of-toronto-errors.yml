summary: >-
  The Timetable Builder API returns errors on two different planes and does not distinguish them by
  HTTP status. The api.easi.utoronto.ca gateway emits {"statusCode","message"} for an unmatched
  route; the TTB service itself emits {"payload":null,"status":[{"code","message"}]} for a search
  that matched nothing. Both arrive as HTTP 404, so a client cannot tell "you asked for a URL that
  does not exist" from "your search found nothing" without parsing the body.
