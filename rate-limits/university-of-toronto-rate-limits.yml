  throttled: 429
limits:
- name: Default
  scope: client
  metric: requests-per-minute
  limit: none-published
  observed: no rate-limit or quota header on any 200 response probed 2026-08-19
  notes: >-
    No published global limit and no observed enforcement. Harvest conservatively; the surface is an
    application back-end for a single official UI, not a metered product.
policies:
- name: Backoff Strategy
  description: Exponential backoff with jitter; honor Retry-After; harvest during off-peak hours.
