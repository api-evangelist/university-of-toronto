source: >-
  Live probes of https://api.easi.utoronto.ca/ttb and the TSpace OAI-PMH endpoint on 2026-08-19.
  No rate-limit header, quota header or Retry-After was returned on any successful response, and
  the University publishes no rate-limit statement for any API.
x-operator: institution
description: >-
  The University of Toronto publishes no rate limits for any of its APIs. On 2026-08-19 the
  institution-operated Timetable Builder API at api.easi.utoronto.ca returned HTTP 200 to every
  probe with no X-RateLimit-*, no Retry-After and no quota signalling of any kind, including for
  POST /ttb/getCourses which returns a 12.9 MB uncompressed body. The absence of a stated limit is
  not permission for volume: treat the surface as an unmetered application back-end, prefer
  getPageableCourses over getCourses, and expect no warning before throttling or blocking. Tenant
  surfaces on Scholaris and Borealis are governed by those platforms' policies, not the
  University's.
notes: >-
  No limit is documented and none was observed. Any figure below is guidance from API Evangelist,
  not a University of Toronto commitment.
sources:
- https://raw.githubusercontent.com/api-evangelist/university-of-toronto/refs/heads/main/apis.yml
