---
aid: university-of-toronto
name: University of Toronto
description: >-
  The University of Toronto is Canada's leading public research university,
  ranked #26 in the QS World University Rankings 2025. Its public developer and
  API footprint is modest and decentralized: the University of Toronto Libraries
  operate the TSpace institutional repository (now hosted on the Scholaris
  DSpace platform), which exposes a standards-based OAI-PMH 2.0 metadata
  endpoint and a DSpace REST API. Student-facing course and timetable data is
  served through the EASI Timetable Builder, but that interface is not publicly
  documented as a developer API. Historically, the student-driven Cobalt project
  published open-data APIs for UofT courses, buildings, and campus services, but
  it has been deprecated/archived since 2020.
