aid: university-of-toronto
name: University of Toronto
x-type: university
x-category: Public Research University
description: >-
  The University of Toronto is Canada's largest public research university, operating three campuses
  (St. George, Mississauga, Scarborough) and ranked in the QS World University Rankings top 25. Like
  almost every institution its size it is a federation of buyers rather than a producer of APIs, and
  this profile is deliberate about which side of that line each surface falls on. Two surfaces are
  genuinely institution-operated, both on utoronto.ca: the Timetable Builder API at
  api.easi.utoronto.ca, run by Enterprise Applications and Solutions Integration (EASI) within U of T
  Information Technology Services, which serves live course, section, meeting-time, enrolment and
  building data across all divisions with no credential required; and the UTORauth Shibboleth
  identity provider, which publishes SAML 2.0 metadata registered in the Canadian Access Federation
  with the REFEDS Research & Scholarship entity category and SIRTFI assurance. Everything else that
  looks like a University of Toronto API is a vendor or consortium contract running under the
  University's name — TSpace now lives on Scholaris, the OCUL-operated DSpace service, and its
  OAI-PMH and REST endpoints are the platform's engineering, not U of T's; the U of T Dataverse is a
  collection inside Borealis. Those relationships are recorded here as tenant surfaces because the
  data is the University's even though the contract is not. There is no developer portal, no API
  documentation, no terms of use for any API, no versioning scheme, no status page and no support
  channel for developers. The University does publish an llms.txt at its web root, which is more
  agent-facing provision than most of the cohort makes.
