  - aid: university-of-toronto:utorauth-shibboleth-idp
    name: UTORauth Shibboleth Identity Provider (SAML 2.0 metadata)
    x-operator: institution
    description: >-
      The University of Toronto's Shibboleth identity provider, entityID
      https://idpz.utorauth.utoronto.ca/shibboleth, serving signed SAML 2.0 metadata from the
      University's own utorauth.utoronto.ca host. Registered in the Canadian Access Federation
      (registration authority http://www.canarie.ca, registered 2018-09-21), asserting the REFEDS
      Research & Scholarship entity category and SIRTFI assurance certification. This is a
      federation login endpoint for humans in a browser rather than a developer API, and it is
      catalogued because it is machine-readable, institution-operated by definition, and the
      University's strongest published standards conformance.
    humanURL: https://its.utoronto.ca/
