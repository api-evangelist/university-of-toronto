  detail: >-
    Full pass on 2026-08-19. Two institution-operated surfaces were found and verified live, both on
    utoronto.ca: the EASI Timetable Builder API (six operations, unauthenticated, real course data)
    and the UTORauth Shibboleth SAML 2.0 identity provider. The June 2026 profile missed the
    timetable API because it guessed paths under ttb.utoronto.ca; the API actually lives on
    api.easi.utoronto.ca and its operation names are declared in the official client bundle. Three
    tenant relationships were confirmed and re-labelled rather than deleted: TSpace OAI-PMH and
    TSpace DSpace REST on Scholaris (OCUL), and the U of T Dataverse collection in Borealis. The
    deprecated community Cobalt open-data API was removed — its endpoint returns 404 and it was never
    institution-operated. What genuinely does not exist: a developer portal, published API
    documentation, an OpenAPI, terms of use for any API, a versioning scheme, a status page, a rate
    limit statement, an OAuth surface, or any developer support channel. Nothing here was blocked
    from us.
