apis:
  - aid: university-of-toronto:ttb-course-timetable
    name: Timetable Builder API
    x-operator: institution
    description: >-
      The public JSON API behind the official University of Toronto Timetable Builder, operated by
      Enterprise Applications and Solutions Integration (EASI) within U of T Information Technology
      Services on the University's own host api.easi.utoronto.ca. Serves course, section,
      meeting-time, instructor, enrolment-control and building data for every division and all three
      campuses. Six operations verified live and unauthenticated on 2026-08-19: reference-data,
      current-session, getMatchingDivisions, getPageableCourses, getCourses and
      getCoursesByCodeAndSectionCode. The University publishes no documentation, no OpenAPI, no terms
      of use and no rate-limit statement for it; CORS is pinned to https://ttb.utoronto.ca so browser
      clients from other origins are blocked while server-side clients are not. The OpenAPI in this
      repository is an API Evangelist observation, not a University artifact.
    humanURL: https://ttb.utoronto.ca/
    baseURL: https://api.easi.utoronto.ca/ttb
