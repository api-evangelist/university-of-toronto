  - aid: university-of-toronto:tspace-oai-pmh
    name: TSpace Institutional Repository (OAI-PMH) — tenant on Scholaris
    x-operator: tenant
    description: >-
      OAI-PMH 2.0 harvesting endpoint for TSpace, the University of Toronto Libraries institutional
      research repository. The repository is the University's — Identify returns repositoryName
      "TSpace" with adminEmail tspace@library.utoronto.ca and an earliest datestamp of 2003 — but the
      endpoint runs on utoronto.scholaris.ca, an institution-specific subdomain of Scholaris, the
      DSpace service operated by the Ontario Council of University Libraries. The University's own
      vanity host tspace.library.utoronto.ca 302-redirects here. Recorded as a tenant relationship:
      the data and the collection policy are U of T's, the contract and the software are not, and the
      generic DSpace specification is deliberately NOT saved under this institution.
    humanURL: https://utoronto.scholaris.ca/
    baseURL: https://utoronto.scholaris.ca/server/oai/request
    tags: [ OAI-PMH, Institutional Repository, DSpace, Library, Metadata, Research, Tenant ]
    properties:
      - type: Documentation
        url: https://utoronto.scholaris.ca/server/oai/request?verb=Identify
      - type: Conformance
        url: conformance/university-of-toronto-conformance.yml
  - aid: university-of-toronto:tspace-dspace-rest
    name: TSpace DSpace REST API — tenant on Scholaris
    x-operator: tenant
    description: >-
      The DSpace 8.4 HAL REST API serving TSpace. Verified live on 2026-08-19: the root document
      returns dspaceName "TSpace", dspaceVersion "DSpace 8.4" and a link index covering communities,
      collections, items, bitstreams and authn. This is the stock DSpace contract shipped by the
      Scholaris platform; the University neither designed nor documents it. Catalogued as a tenant
      surface so the relationship is visible without crediting U of T with DSpace's engineering.
    humanURL: https://utoronto.scholaris.ca/
    baseURL: https://utoronto.scholaris.ca/server/api
    tags: [ REST, DSpace, Institutional Repository, Library, Research, Tenant ]
    properties:
      - type: Documentation
        url: https://utoronto.scholaris.ca/server/api
  - aid: university-of-toronto:uoft-dataverse-borealis
    name: U of T Dataverse (Borealis) — tenant
    x-operator: tenant
    description: >-
      The University of Toronto's research data repository collection inside Borealis, the Canadian
      Dataverse Repository operated by Scholars Portal for the Ontario Council of University
      Libraries. Verified live on 2026-08-19 via the Dataverse Native API at
      https://borealisdata.ca/api/dataverses/toronto, which returns alias "toronto", name "U of T
      Dataverse", affiliation "University of Toronto". The Dataverse Native API contract belongs to
      the Dataverse Project and the deployment to Borealis; U of T operates the collection, the
      curation and the deposits. No Dataverse specification is saved under this institution.
    humanURL: https://borealisdata.ca/dataverse/toronto
    tags: [ Research Data, Dataverse, Repository, Open Data, Tenant ]
    properties:
      - type: Documentation
        url: https://borealisdata.ca/dataverse/toronto
    x-note: >-
      Deliberately carries no baseURL. borealisdata.ca is a shared vendor host serving many Canadian
      institutions; publishing it as a U of T base URL is precisely the misattribution this profile
      exists to prevent. The relationship is the fact worth recording, not the endpoint.
