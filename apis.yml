  - aid: university-of-toronto:cobalt
    name: Cobalt Open Data API (deprecated)
    description: >-
      Cobalt was a student-driven open-data project providing REST APIs for
      University of Toronto public information including courses, buildings,
      textbooks, food, athletics, exams, parking, and shuttles. The project is
